<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noxera - Manga & Webtoon Oku</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0b14;
            color: #ffffff;
        }

        header {
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282333;
            background: #130f1d;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #a855f7;
            text-decoration: none;
        }

        nav a {
            color: #aaa3b8;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #a855f7;
        }

        .hero {
            padding: 60px 7%;
            text-align: center;
            background: linear-gradient(180deg, #130f1d 0%, #0d0b14 100%);
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa3b8;
            margin-bottom: 30px;
        }

        .search {
            width: min(600px, 90%);
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid #393247;
            background: #17131f;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search:focus {
            border-color: #a855f7;
        }

        .section {
            padding: 30px 7%;
        }

        .section h2 {
            margin-bottom: 25px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 22px;
        }

        .manga-card {
            background: #17131f;
            border: 1px solid #292333;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .manga-card:hover {
            transform: translateY(-5px);
            border-color: #a855f7;
        }

        .cover {
            height: 230px;
            background: #252031;
            overflow: hidden;
            position: relative;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .manga-info {
            padding: 12px;
        }

        .manga-info h3 {
            font-size: 15px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .manga-info p {
            color: #9991a8;
            font-size: 13px;
        }

        footer {
            text-align: center;
            padding: 40px;
            margin-top: 40px;
            border-top: 1px solid #282333;
            color: #777080;
        }
    </style>
</head>

<body>

<header>
    <a href="#" class="logo">🌙 NOXERA</a>

    <nav>
        <a href="#">Ana Sayfa</a>
        <a href="#">Türler</a>
        <a href="#">Favoriler</a>
    </nav>
</header>

<section class="hero">
    <h1>Manga dünyasına hoş geldin.</h1>
    <p>Keşfet. Oku. Yeni dünyalara dal.</p>

    <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="🔍 Manga veya webtoon ara..."
        onkeyup="searchManga()"
    >
</section>

<section class="section">
    <h2>🔥 Popüler Mangalar</h2>

    <div class="manga-grid" id="mangaGrid">

        <!-- Örnek Manga Kartı 1 -->
        <a href="reader.html" class="manga-card">
            <div class="cover">
                <img src="https://via.placeholder.com/200x300/252031/ffffff?text=Solo+Leveling" alt="Manga Kapak">
            </div>
            <div class="manga-info">
                <h3>Solo Leveling</h3>
                <p>Action · Fantasy</p>
            </div>
        </a>

        <!-- Örnek Manga Kartı 2 -->
        <a href="reader.html" class="manga-card">
            <div class="cover">
                <img src="https://via.placeholder.com/200x300/252031/ffffff?text=Moonlight" alt="Manga Kapak">
            </div>
            <div class="manga-info">
                <h3>Moonlight Sculptor</h3>
                <p>Mystery · Fantasy</p>
            </div>
        </a>

        <!-- Örnek Manga Kartı 3 -->
        <a href="reader.html" class="manga-card">
            <div class="cover">
                <img src="https://via.placeholder.com/200x300/252031/ffffff?text=Crimson" alt="Manga Kapak">
            </div>
            <div class="manga-info">
                <h3>Crimson Tower</h3>
                <p>Action · Drama</p>
            </div>
        </a>

        <!-- Örnek Manga Kartı 4 -->
        <a href="reader.html" class="manga-card">
            <div class="cover">
                <img src="https://via.placeholder.com/200x300/252031/ffffff?text=Starlight" alt="Manga Kapak">
            </div>
            <div class="manga-info">
                <h3>Starlight Knight</h3>
                <p>Romance · Fantasy</p>
            </div>
        </a>

    </div>
</section>

<footer>
    © 2026 Noxera · Manga platform
</footer>

<script>
    // Canlı Arama Fonksiyonu
    function searchManga() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('manga-card');

        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
            let genre = cards[i].getElementsByTagName('p')[0].innerText.toLowerCase();

            if (title.includes(input) || genre.includes(input)) {
                cards[i].style.display = "flex";
            } else {
                cards[i].style.display = "none";
            }
        }
    }
</script>

</body>
</html>

</body>
</html>
